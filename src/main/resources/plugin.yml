name: ChickenWar
version: 3.1
main: com.example.chickenwar.ChickenWarPlugin
api-version: '1.21'
description: Dai chien ga dinh cao.
author: YourName
depend: [Vault]
commands:
  chickenwar:
    description: Lenh quan ly dau truong ga
    aliases: [cw]
    usage: /cw <build|start|end|reload|restart|bet>
permissions:
  chickenwar.admin:
    description: Quyen quan ly tran dau (Build, Start, End...)
    default: op
  chickenwar.bet:
    description: Quyen dat cuoc
    default: true